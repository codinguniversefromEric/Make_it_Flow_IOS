<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 其他原本的 head 標籤 (如 title, meta 等) -->

    <!-- 一般瀏覽器分頁圖示 -->
    <link rel="icon" type="image/jpeg" href="Assets/ePdfUB%20icon.jpg">

    <!-- iOS Safari 分頁標籤與主畫面專用圖示 -->
    <link rel="apple-touch-icon" href="Assets/ePdfUB%20icon.jpg">
        
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePdfUB - OS Simulator</title>
    <style>
        :root {
            --os-bg: #008080; /* Retro teal background */
            --window-bg: #c0c0c0;
            --window-border-light: #ffffff;
            --window-border-dark: #000000;
            --window-border-shadow: #808080;
            --title-bg: #000080;
            --title-text: #ffffff;
            --text-main: #000000;
            --terminal-bg: #000000;
            --terminal-text: #00ff00;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --os-bg: #050505; /* Hacker dark */
                --window-bg: #1a1a1a;
                --window-border-light: #444;
                --window-border-dark: #000;
                --window-border-shadow: #111;
                --title-bg: #000000;
                --title-text: #00ff00;
                --text-main: #00ff00;
            }
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--os-bg);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Lang switcher in top right like an OS menu */
        .os-menu {
            position: absolute;
            top: 0; left: 0; right: 0;
            background-color: var(--window-bg);
            border-bottom: 2px solid var(--window-border-dark);
            padding: 5px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-main);
            box-shadow: 0 2px 0 var(--window-border-shadow);
        }
        .os-menu a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 15px;
        }
        .os-menu a:hover {
            background-color: var(--title-bg);
            color: var(--title-text);
        }

        /* Retro Window */
        .window {
            background-color: var(--window-bg);
            border-top: 2px solid var(--window-border-light);
            border-left: 2px solid var(--window-border-light);
            border-right: 2px solid var(--window-border-dark);
            border-bottom: 2px solid var(--window-border-dark);
            width: 90%;
            max-width: 500px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .title-bar {
            background-color: var(--title-bg);
            color: var(--title-text);
            padding: 4px 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .title-buttons {
            display: flex;
            gap: 4px;
        }

        .title-btn {
            background-color: var(--window-bg);
            border-top: 1px solid var(--window-border-light);
            border-left: 1px solid var(--window-border-light);
            border-right: 1px solid var(--window-border-dark);
            border-bottom: 1px solid var(--window-border-dark);
            width: 16px;
            height: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        .title-btn:active {
            border-top: 1px solid var(--window-border-dark);
            border-left: 1px solid var(--window-border-dark);
            border-right: 1px solid var(--window-border-light);
            border-bottom: 1px solid var(--window-border-light);
        }

        .window-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        .logo-img {
            width: 120px;
            margin-bottom: 20px;
            border: 2px solid var(--window-border-dark);
        }

        .drop-zone {
            width: 100%;
            border: 2px dashed var(--text-main);
            padding: 30px 0;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .drop-zone:hover {
            background-color: var(--title-bg);
            color: var(--title-text);
            border-color: var(--title-bg);
        }

        .terminal {
            width: 100%;
            background-color: var(--terminal-bg);
            color: var(--terminal-text);
            height: 100px;
            border: 2px inset var(--window-border-dark);
            padding: 10px;
            font-size: 12px;
            overflow-y: auto;
            box-sizing: border-box;
            text-align: left;
        }

        /* Modal Alert */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal {
            background-color: var(--window-bg);
            border-top: 2px solid var(--window-border-light);
            border-left: 2px solid var(--window-border-light);
            border-right: 2px solid var(--window-border-dark);
            border-bottom: 2px solid var(--window-border-dark);
            padding: 20px;
            width: 300px;
            text-align: center;
            color: var(--text-main);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
        }
        .modal h3 {
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .modal-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            background-color: var(--window-bg);
            border-top: 2px solid var(--window-border-light);
            border-left: 2px solid var(--window-border-light);
            border-right: 2px solid var(--window-border-dark);
            border-bottom: 2px solid var(--window-border-dark);
            color: var(--text-main);
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .modal-btn:active {
            border-top: 2px solid var(--window-border-dark);
            border-left: 2px solid var(--window-border-dark);
            border-right: 2px solid var(--window-border-light);
            border-bottom: 2px solid var(--window-border-light);
        }
        .tf-icon {
            font-size: 24px;
        }
    </style>

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="ePdfUB - OS Simulator">
    <meta name="twitter:description" content="100% On-device. Fast, private, and brutalist PDF to EPUB Engine.">

</head>
<body>
    <div class="os-menu">
        <div><span>System</span> <span>File</span> <a href="privacy.html" style="color: inherit; text-decoration: none; cursor: pointer;">Privacy</a></div>
        <div><a href="index.html" style="text-decoration: underline;">EN</a> | <a href="index_zh.html">ZH</a></div>
    </div>

    <div class="window">
        <div class="title-bar">
            <span>ePdfUB_Engine.exe</span>
            <div class="title-buttons">
                <div class="title-btn">_</div>
                <div class="title-btn">O</div>
                <div class="title-btn">X</div>
            </div>
        </div>
        <div class="window-content">
            <img src="assets/ePdfUB icon.jpg" alt="ePdfUB Logo" class="logo-img">
            
            <div class="drop-zone" id="dropZone" onclick="startSim()">
                [ CLICK OR DROP PDF HERE ]
            </div>

            <div class="terminal" id="term">
                > System initialized.<br>
                > Awaiting input...
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>⚠️ SYSTEM ALERT</h3>
            <p>Mobile Neural Engine Required.</p>
            <p style="font-size: 12px;">To execute 100% offline YOLOv26 processing, you must route this task to an iOS device via TestFlight.</p>
            <a href="https://testflight.apple.com/join/nVmTyMGb" class="modal-btn" target="_blank" rel="noopener noreferrer">
                LAUNCH TESTFLIGHT
            </a>
            <div class="modal-btn" onclick="closeModal()" style="margin-left: 10px;">CANCEL</div>
        </div>
    </div>

    <script>
        const term = document.getElementById('term');
        const modal = document.getElementById('modalOverlay');
        let isRunning = false;

        function startSim() {
            if (isRunning) return;
            isRunning = true;
            term.innerHTML = "> Input received: document.pdf<br>";
            
            const logs = [
                "Initializing CoreML...",
                "Loading YOLOv26 Nano weights...",
                "Scanning Document Layout...",
                "ERROR: Neural Engine (ANE) not found on web browser.",
                "Rerouting to native iOS protocol..."
            ];

            let delay = 500;
            logs.forEach((log, index) => {
                setTimeout(() => {
                    term.innerHTML += "> " + log + "<br>";
                    term.scrollTop = term.scrollHeight;
                    if (index === logs.length - 1) {
                        setTimeout(() => {
                            modal.style.display = 'flex';
                            isRunning = false;
                        }, 800);
                    }
                }, delay);
                delay += (Math.random() * 600 + 300);
            });
        }

        function closeModal() {
            modal.style.display = 'none';
            term.innerHTML += "> Action aborted.<br>> Awaiting input...<br>";
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
