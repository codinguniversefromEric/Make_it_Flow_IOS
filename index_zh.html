<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePdfUB - OS Simulator</title>
    <style>
        :root {
            --os-bg: #008080;
            --window-bg: #c0c0c0;
            --window-border-light: #ffffff;
            --window-border-dark: #000000;
            --window-border-shadow: #808080;
            --title-bg: #000080;
            --title-text: #ffffff;
            --text-main: #000000;
            --terminal-bg: #000000;
            --terminal-text: #00ff00;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --os-bg: #050505;
                --window-bg: #1a1a1a;
                --window-border-light: #444;
                --window-border-dark: #000;
                --window-border-shadow: #111;
                --title-bg: #000000;
                --title-text: #00ff00;
                --text-main: #00ff00;
            }
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--os-bg);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .os-menu {
            position: absolute;
            top: 0; left: 0; right: 0;
            background-color: var(--window-bg);
            border-bottom: 2px solid var(--window-border-dark);
            padding: 5px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-main);
            box-shadow: 0 2px 0 var(--window-border-shadow);
        }
        .os-menu a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 15px;
        }
        .os-menu a:hover {
            background-color: var(--title-bg);
            color: var(--title-text);
        }

        .window {
            background-color: var(--window-bg);
            border-top: 2px solid var(--window-border-light);
            border-left: 2px solid var(--window-border-light);
            border-right: 2px solid var(--window-border-dark);
            border-bottom: 2px solid var(--window-border-dark);
            width: 90%;
            max-width: 500px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .title-bar {
            background-color: var(--title-bg);
            color: var(--title-text);
            padding: 4px 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .title-buttons {
            display: flex;
            gap: 4px;
        }

        .title-btn {
            background-color: var(--window-bg);
            border-top: 1px solid var(--window-border-light);
            border-left: 1px solid var(--window-border-light);
            border-right: 1px solid var(--window-border-dark);
            border-bottom: 1px solid var(--window-border-dark);
            width: 16px;
            height: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        .title-btn:active {
            border-top: 1px solid var(--window-border-dark);
            border-left: 1px solid var(--window-border-dark);
            border-right: 1px solid var(--window-border-light);
            border-bottom: 1px solid var(--window-border-light);
        }

        .window-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        .logo-img {
            width: 120px;
            margin-bottom: 20px;
            border: 2px solid var(--window-border-dark);
        }

        .drop-zone {
            width: 100%;
            border: 2px dashed var(--text-main);
            padding: 30px 0;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .drop-zone:hover {
            background-color: var(--title-bg);
            color: var(--title-text);
            border-color: var(--title-bg);
        }

        .terminal {
            width: 100%;
            background-color: var(--terminal-bg);
            color: var(--terminal-text);
            height: 100px;
            border: 2px inset var(--window-border-dark);
            padding: 10px;
            font-size: 12px;
            overflow-y: auto;
            box-sizing: border-box;
            text-align: left;
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal {
            background-color: var(--window-bg);
            border-top: 2px solid var(--window-border-light);
            border-left: 2px solid var(--window-border-light);
            border-right: 2px solid var(--window-border-dark);
            border-bottom: 2px solid var(--window-border-dark);
            padding: 20px;
            width: 300px;
            text-align: center;
            color: var(--text-main);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
        }
        .modal h3 {
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .modal-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            background-color: var(--window-bg);
            border-top: 2px solid var(--window-border-light);
            border-left: 2px solid var(--window-border-light);
            border-right: 2px solid var(--window-border-dark);
            border-bottom: 2px solid var(--window-border-dark);
            color: var(--text-main);
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .modal-btn:active {
            border-top: 2px solid var(--window-border-dark);
            border-left: 2px solid var(--window-border-dark);
            border-right: 2px solid var(--window-border-light);
            border-bottom: 2px solid var(--window-border-light);
        }
    </style>

    <meta property="og:title" content="ePdfUB - OS Simulator">
    <meta property="og:description" content="極速、離線且硬派的 PDF 轉 EPUB 引擎。完全保障隱私。">
    <meta property="og:image" content="https://codinguniversefromeric.github.io/ePdfUB_IOS/assets/ePdfUB icon.jpg">
    <meta property="og:url" content="https://codinguniversefromeric.github.io/ePdfUB_IOS/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="ePdfUB - OS Simulator">
    <meta name="twitter:description" content="極速、離線且硬派的 PDF 轉 EPUB 引擎。完全保障隱私。">
    <meta name="twitter:image" content="https://codinguniversefromeric.github.io/ePdfUB_IOS/assets/logo.jpg">
</head>
<body>
    <div class="os-menu">
        <div><span>系統</span> <span>檔案</span> <span>說明</span></div>
        <div><a href="index.html">EN</a> | <a href="index_zh.html" style="text-decoration: underline;">ZH</a></div>
    </div>

    <div class="window">
        <div class="title-bar">
            <span>ePdfUB_Engine.exe</span>
            <div class="title-buttons">
                <div class="title-btn">_</div>
                <div class="title-btn">O</div>
                <div class="title-btn">X</div>
            </div>
        </div>
        <div class="window-content">
            <img src="assets/logo.jpg" alt="ePdfUB Logo" class="logo-img">
            
            <div class="drop-zone" id="dropZone" onclick="startSim()">
                [ 點擊或拖曳 PDF 至此 ]
            </div>

            <div class="terminal" id="term">
                > 系統初始化完成。<br>
                > 等待輸入指令...
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>⚠️ 系統警告</h3>
            <p>需要原生 Apple 神經網路引擎支援。</p>
            <p style="font-size: 12px;">為了確保 100% 離線的 YOLOv26 運算隱私，請將此任務導向至 iOS 裝置進行處理。</p>
            <a href="https://testflight.apple.com/join/nVmTyMGb" class="modal-btn" target="_blank" rel="noopener noreferrer">
                啟動 TESTFLIGHT
            </a>
            <div class="modal-btn" onclick="closeModal()" style="margin-left: 10px;">取消</div>
        </div>
    </div>

    <script>
        const term = document.getElementById('term');
        const modal = document.getElementById('modalOverlay');
        let isRunning = false;

        function startSim() {
            if (isRunning) return;
            isRunning = true;
            term.innerHTML = "> 接收檔案: document.pdf<br>";
            
            const logs = [
                "啟動 CoreML 引擎...",
                "載入 YOLOv26 Nano 權重模型...",
                "正在進行深度版面掃描...",
                "錯誤: 網頁端缺少 Apple 晶片硬體加速支援。",
                "正在重新導向至 iOS 原生應用程式..."
            ];

            let delay = 500;
            logs.forEach((log, index) => {
                setTimeout(() => {
                    term.innerHTML += "> " + log + "<br>";
                    term.scrollTop = term.scrollHeight;
                    if (index === logs.length - 1) {
                        setTimeout(() => {
                            modal.style.display = 'flex';
                            isRunning = false;
                        }, 800);
                    }
                }, delay);
                delay += (Math.random() * 600 + 300);
            });
        }

        function closeModal() {
            modal.style.display = 'none';
            term.innerHTML += "> 處理已中止。<br>> 等待輸入指令...<br>";
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
