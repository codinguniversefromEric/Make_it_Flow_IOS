<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFlux - PDF 轉 EPUB</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --container-bg: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #007aff;
            --accent-hover: #0071eb;
            --border-color: #d2d2d7;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --container-bg: #1c1c1e;
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --accent-color: #0a84ff;
                --accent-hover: #3299ff;
                --border-color: #38383a;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
        }
        .lang-switcher a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0 4px;
        }
        .lang-switcher a.active {
            color: var(--text-primary);
            font-weight: 600;
        }
        .lang-switcher a:hover {
            text-decoration: underline;
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
            margin-top: 20px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .subtitle {
            font-size: 24px;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto 40px;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .cta-button:hover {
            background-color: var(--accent-hover);
        }

        .tf-hint {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            margin-bottom: 0;
        }

        .features-section {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            padding: 60px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .feature-card {
            background-color: var(--container-bg);
            padding: 32px;
            border-radius: 20px;
            flex: 1;
            min-width: 250px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .feature-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .feature-desc {
            color: var(--text-secondary);
            font-size: 15px;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-color);
        }

        footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }
            .subtitle {
                font-size: 20px;
            }
            .features-section {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <a href="index.html">EN</a> | <a href="#" class="active">繁體中文</a>
    </div>

    <header>
        <h1>在您的裝置上，將 PDF 完美轉換為精美 EPUB。</h1>
        <p class="subtitle">PDFlux 提供快速、隱私且輕鬆的檔案轉換，為您打造原生的閱讀體驗。</p>
        <a href="https://testflight.apple.com/join/nVmTyMGb" class="cta-button" target="_blank" rel="noopener noreferrer">加入 TestFlight</a>
        <p class="tf-hint">* 需搭配 Apple 官方的 TestFlight 應用程式</p>
    </header>

    <div class="features-section">
        <div class="feature-card">
            <div class="feature-icon">🔒</div>
            <div class="feature-title">100% 裝置端處理</div>
            <div class="feature-desc">絕對隱私。即時擷取 PDF 的文字與圖片，您的檔案永遠不會上傳至伺服器。</div>
        </div>
        <div class="feature-card">
            <div class="feature-icon">🧠</div>
            <div class="feature-title">智慧版面分析</div>
            <div class="feature-desc">智慧辨識閱讀順序、分欄與圖表，完美重構您的文件。</div>
        </div>
        <div class="feature-card">
            <div class="feature-icon">📚</div>
            <div class="feature-title">出版社等級 EPUB</div>
            <div class="feature-desc">產出精美、具 Apple Books 原生質感的 EPUB，支援響應式排版與深色模式。</div>
        </div>
    </div>

    <footer>
        <a href="privacy_zh.html">隱私權政策</a>
        <p style="color: var(--text-secondary); font-size: 12px; margin-top: 12px;">&copy; 2026 PDFlux.</p>
    </footer>

</body>
</html>
